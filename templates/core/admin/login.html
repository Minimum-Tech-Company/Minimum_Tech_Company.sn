{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Admin MinTech</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <a href="/" class="nav-logo" style="justify-content:center;margin-bottom:8px">
        <span class="logo-icon"><i class="ri-code-s-slash-line"></i></span>
        <span class="logo-text">Min<span class="accent">Tech</span></span>
      </a>
      <p class="subtitle">Panel d'administration</p>
      {% if messages %}{% for msg in messages %}<div class="alert alert-error"><i class="ri-error-warning-line"></i> {{ msg }}</div>{% endfor %}{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group"><label><i class="ri-user-line"></i> Identifiant</label><input type="text" name="username" required placeholder="Nom d'utilisateur"></div>
        <div class="form-group"><label><i class="ri-lock-line"></i> Mot de passe</label><input type="password" name="password" required placeholder="••••••••"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center"><i class="ri-login-box-line"></i> Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
