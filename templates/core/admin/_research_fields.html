<div class="form-group"><label>Titre</label><input type="text" name="title" value="{{ r.title|default:'' }}" required></div>
<div class="form-group"><label>Sous-titre</label><input type="text" name="subtitle" value="{{ r.subtitle|default:'' }}"></div>
<div class="form-group">
  <label>Photo de couverture</label>
  {% if r.image %}<img src="{{ r.image.url }}" alt="" style="max-height:120px;border-radius:8px;margin-bottom:8px;display:block">{% endif %}
  <input type="file" name="image" accept="image/*">
</div>
<div class="form-group"><label>Contexte</label><textarea name="context" rows="4">{{ r.context|default:'' }}</textarea></div>
<div class="form-group"><label>Objectif</label><textarea name="goal" rows="4">{{ r.goal|default:'' }}</textarea></div>
<div class="form-group"><label>État actuel</label><textarea name="current_state" rows="4">{{ r.current_state|default:'' }}</textarea></div>
<div class="form-group"><label>Résultats</label><textarea name="results" rows="4">{{ r.results|default:'' }}</textarea></div>
<div class="form-group"><label>Améliorations</label><textarea name="improvements" rows="4">{{ r.improvements|default:'' }}</textarea></div>
<div class="form-group"><label>Lien externe</label><input type="url" name="link" value="{{ r.link|default:'' }}" placeholder="https://..."></div>
<div class="form-group"><label><input type="checkbox" name="active" {% if r.active or not r %}checked{% endif %}> Actif</label></div>
